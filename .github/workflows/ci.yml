name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A force-push while a run is in flight leaves the old one racing the new one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          # Nothing here pushes, and a token left in the local git config is
          # readable by every step that runs after it.
          persist-credentials: false

      # Type checking is off for JavaScript, because the compiled message output
      # is the only JavaScript under src and it does not check against the
      # Workers global. That stays true only while nobody writes any by hand.
      - name: No authored JavaScript under src
        run: |
          found=$(git ls-files 'src/*.js' 'src/**/*.js' 'src/**/*.jsx')
          if [ -n "$found" ]; then
            echo "Nothing type-checks these. Write them in TypeScript:"
            echo "$found"
            exit 1
          fi

      - uses: oven-sh/setup-bun@v2
        with:
          # A floating version puts the runtime's release schedule in the path of
          # every pull request. The suite reads Intl output, which moves with it.
          bun-version-file: .bun-version

      # A registry tarball that fails to download or extract fails the whole
      # run, and nothing in the repository caused it. Three attempts are enough
      # for a transient registry fault; a wrong lockfile fails all three.
      - name: Install
        run: |
          for attempt in 1 2 3; do
            bun install --frozen-lockfile && exit 0
            echo "bun install failed (attempt $attempt of 3)"
            sleep $((attempt * 10))
          done
          exit 1

      - name: Types
        run: bun run check

      - name: Tests
        run: bun run test

      # The build compiles the message catalogs and runs the Cloudflare adapter,
      # neither of which the other two steps exercise. It reads no secrets: the
      # database client and the extraction client are constructed on first use.
      - name: Build
        run: bun run build
