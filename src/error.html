<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0f766e" />
    <title>Unable to open page · Health Tracker</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #f8fafc; color: #0f172a; font-family: system-ui, sans-serif; }
      main { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 3rem 1.5rem; }
      section { width: 100%; max-width: 32rem; }
      .brand { display: inline-flex; align-items: center; gap: .75rem; margin-bottom: 3rem; color: inherit; text-decoration: none; font-size: 1.125rem; font-weight: 600; }
      .status { color: #0f766e; font: 600 .875rem ui-monospace, monospace; letter-spacing: .15em; }
      h1 { font-size: clamp(1.875rem, 5vw, 2.25rem); line-height: 1.2; letter-spacing: -.025em; font-weight: 600; }
      p { color: #475569; line-height: 1.75; }
      .home { display: inline-flex; align-items: center; min-height: 44px; margin-top: 1rem; border-radius: .75rem; background: #0f766e; padding: .75rem 1.25rem; color: white; font-size: .875rem; font-weight: 600; text-decoration: none; }
      .home:hover { background: #115e59; }
      a:focus-visible { outline: 2px solid #0f766e; outline-offset: 4px; }
      .notice { margin-top: 2rem; font-size: .875rem; color: #64748b; }
    </style>
  </head>
  <body>
    <main>
      <section aria-labelledby="error-title">
        <a class="brand" href="/">
          <svg aria-hidden="true" width="40" height="40" viewBox="0 0 128 128"><rect width="128" height="128" rx="28" fill="#f3fbf4" /><path d="M64 34v60M34 64h60" stroke="#1f9d55" stroke-width="20" stroke-linecap="round" /></svg>
          Health Tracker
        </a>
        <p class="status">%sveltekit.status%</p>
        <h1 id="error-title">We couldn’t open this page</h1>
        <p>Please try again in a moment. If the problem continues, note the page address and time so we can investigate.</p>
        <a class="home" href="/">Go to home page</a>
        <p class="notice">If this happened while saving, check your records before submitting again.</p>
      </section>
    </main>
  </body>
</html>
